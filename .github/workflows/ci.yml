name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pubtrack
          POSTGRES_PASSWORD: pubtrack
          POSTGRES_DB: pubtrack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pubtrack -d pubtrack_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://pubtrack:pubtrack@localhost:5432/pubtrack_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      JWT_ACCESS_EXPIRES_SECONDS: 900
      JWT_REFRESH_EXPIRES_SECONDS: 604800
      CORS_ORIGINS: http://localhost:3001,http://localhost:3002
      NODE_ENV: test
      PORT: 3000

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm test -- --passWithNoTests
      - run: npm run test:e2e
