services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: pubtrack
      POSTGRES_PASSWORD: pubtrack
      POSTGRES_DB: pubtrack
    ports:
      - '5432:5432'
    volumes:
      - pubtrack_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pubtrack -d pubtrack']
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - pubtrack_redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pubtrack_pgdata:
  pubtrack_redisdata:
